<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4">
      <div class="flex items-center gap-8">
        <a routerLink="/home" class="flex items-center gap-2">
          <span
            class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-xs font-bold text-white"
            aria-hidden="true"
          >
            OMS
          </span>
          <span class="font-semibold text-slate-900">Enterprise OMS</span>
        </a>

        <nav class="flex items-center gap-1 text-sm" aria-label="Main">
          <a
            routerLink="/home"
            routerLinkActive="bg-slate-100 text-slate-900"
            class="rounded-md px-3 py-2 text-slate-600 hover:bg-slate-50"
          >
            Home
          </a>

          @if (auth.hasPermission(permissions.Roles.View)) {
            <a
              routerLink="/roles"
              routerLinkActive="bg-slate-100 text-slate-900"
              class="rounded-md px-3 py-2 text-slate-600 hover:bg-slate-50"
            >
              Roles
            </a>
          }
        </nav>
      </div>

      @if (auth.user(); as current) {
        <div class="flex items-center gap-4">
          <div class="hidden text-right sm:block">
            <p class="text-sm font-medium text-slate-900">{{ current.fullName }}</p>
            <p class="text-xs text-slate-500">{{ current.role }}</p>
          </div>
          <button
            type="button"
            (click)="auth.logout()"
            class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 ring-1 ring-slate-300 hover:bg-slate-50"
          >
            Sign out
          </button>
        </div>
      }
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <router-outlet />
  </main>
</div>
